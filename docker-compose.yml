services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lunora
      POSTGRES_USER: lunora
      POSTGRES_PASSWORD: lunora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunora -d lunora"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

