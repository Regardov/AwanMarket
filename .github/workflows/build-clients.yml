name: Build AwanMarket clients

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public HTTPS address of the AwanMarket backend
        required: true
        default: https://api.example.com

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: flutter pub get
      - name: Build Android APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build apk --release --dart-define="API_BASE_URL=$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: AwanMarket-Android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r desktop/requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name AwanMarket desktop/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: AwanMarket-Windows
          path: dist/AwanMarket.exe

